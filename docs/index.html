<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121712">
  <meta name="description" content="One-job budget: how much is left to spend this month.">
  <title>Budget</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

  <div class="app" id="app" data-view="home">

    <!-- ================= HOME ================= -->
    <div class="view view-home">
      <header class="app-head">
        <span class="label" id="month-title">…</span>
        <span class="head-spacer"></span>
        <button class="icon-btn" data-go="settings" aria-label="Settings">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M21.2 12h-2.6M5.4 12H2.8M18.5 5.5l-1.9 1.9M7.4 16.6l-1.9 1.9M18.5 18.5l-1.9-1.9M7.4 7.4L5.5 5.5"/></svg>
        </button>
      </header>

      <section class="hero" id="hero"></section>

      <section class="section" id="categories-section"></section>

      <section class="section" id="expenses-section"></section>
    </div>

    <!-- ================= HISTORY ================= -->
    <div class="view view-history">
      <header class="app-head">
        <span class="label">Past months</span>
      </header>
      <div id="history-list"></div>
    </div>

    <!-- ================= SETTINGS ================= -->
    <div class="view view-settings">
      <header class="app-head">
        <button class="icon-btn" data-go="home" aria-label="Back">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <span class="label">Settings</span>
      </header>
      <div id="settings-body">
        <p class="empty">Settings arrive in the next update.</p>
      </div>
    </div>

    <!-- ================= BOTTOM BAR ================= -->
    <nav class="tab-bar">
      <button class="tab active" data-go="home">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/></svg>
        Home
      </button>
      <button class="fab" id="fab" aria-label="Add expense">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="tab" data-go="history">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
        History
      </button>
    </nav>

  </div>

  <!-- ================= ADD / EDIT SHEET ================= -->
  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="Expense">
    <div class="grab"></div>
    <div class="sheet-head">
      <span class="label" id="sheet-title">New expense</span>
      <button class="icon-btn" id="sheet-close" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="amount-row" id="amount-row">
      <span class="cur">$</span>
      <input class="amount-input money" id="amount" inputmode="decimal" placeholder="0.00" aria-label="Amount" autocomplete="off">
    </div>
    <p class="field-error" id="amount-error">Enter an amount like 12.50</p>

    <div class="chips" id="chips"></div>

    <div class="meta-row">
      <input class="date-input money" type="date" id="date" aria-label="Date">
      <input class="note-input" id="note" placeholder="Note (optional)" aria-label="Note" autocomplete="off" maxlength="80">
    </div>

    <button class="save-btn" id="save">Save expense</button>
    <button class="delete-btn" id="delete">Delete expense</button>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
